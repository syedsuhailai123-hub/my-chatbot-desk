<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Desk</title>
<style>
  body { margin: 0; background: #0b1020; color: #e6edf3; font-family: system-ui, sans-serif; }
  nav { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px; position: sticky; top: 0;
        background: #0b1020; border-bottom: 1px solid #223; z-index: 5; }
  nav button, .card { background: #1a2238; color: #e6edf3; border: 1px solid #334; border-radius: 10px;
        padding: 10px 14px; font-size: 15px; cursor: pointer; }
  nav button.active { background: #2d4a8a; }
  #home { padding: 20px; }
  #home h1 { font-size: 22px; margin: 0 0 16px; }
  .card { display: block; width: 100%; text-align: left; margin-bottom: 12px; padding: 18px; box-sizing: border-box; }
  .card small { display: block; color: #8b98a9; margin-top: 4px; font-size: 13px; }
  iframe { display: none; width: 100%; height: calc(100vh - 60px); border: 0; }
  iframe.show { display: block; }
</style>
</head>
<body>
<nav>
  <button data-s="home" class="active">Home</button>
  <button data-s="chart">Trading</button>
  <button data-s="signal">Signal</button>
  <button data-s="candles">Candles and Timer</button>
</nav>

<div id="home">
  <h1>Trading Desk</h1>
  <button class="card" data-s="chart">Trading<small>Chart and forward test</small></button>
  <button class="card" data-s="signal">Signal<small>Live signal and decision</small></button>
  <button class="card" data-s="candles">Candles and Timer<small>Hourly candle log and countdown</small></button>
</div>

<iframe id="f-chart" src="trading/chart.html"></iframe>
<iframe id="f-signal" src="trading/signal.html"></iframe>
<iframe id="f-candles" src="trading/candles.html"></iframe>

<script>
  const home = document.getElementById('home');
  function go(s) {
    home.style.display = s === 'home' ? 'block' : 'none';
    document.querySelectorAll('iframe').forEach(f => f.classList.toggle('show', f.id === 'f-' + s));
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.s === s));
    history.replaceState(null, '', s === 'home' ? '#' : '#' + s);
  }
  document.querySelectorAll('[data-s]').forEach(el =>
    el.addEventListener('click', () => go(el.dataset.s)));
  const start = location.hash.slice(1);
  go(['chart', 'signal', 'candles'].includes(start) ? start : 'home');
</script>
</body>
</html>
