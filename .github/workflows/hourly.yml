name: hourly-desk

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests streamlit pandas numpy

      - name: Collect data and make the daily AI ideas
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python daily_desk.py daily

      - name: Run the 5 paper slots
        run: python paper_trader.py

      - name: Run the forward test (frozen gold rule)
        run: python forward_test.py

      - name: Build chart and grade predictions
        run: python chart_data.py

      - name: Save results to the repository
        run: |
          git config user.name "desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git commit -m "Hourly update" || echo "Nothing new to save"
          git pull --rebase -q
          git push
